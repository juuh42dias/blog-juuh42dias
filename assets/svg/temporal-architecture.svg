<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 330" width="100%" style="max-width: 600px; display: block;">
  <style>
    text { font-family: Verdana, sans-serif; font-size: 13px; fill: #1e1e1e; text-anchor: middle; }
    .box { fill: #f0f0f0; stroke: #1e1e1e; stroke-width: 1.5; rx: 5; }
    .arrow { stroke: #1e1e1e; stroke-width: 1.5; fill: none; marker-end: url(#a); }
    .ds { font-size: 11px; fill: #555; }
  </style>
  <defs>
    <marker id="a" fill="#1e1e1e" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z"/></marker>
  </defs>

  <!-- Row 1 -->
  <rect class="box" x="20" y="10" width="120" height="44"/>
  <text x="80" y="41">Client</text>

  <line class="arrow" x1="140" y1="32" x2="185" y2="32"/>
  <text x="162" y="24" class="ds">start_workflow</text>

  <rect class="box" x="190" y="10" width="150" height="44"/>
  <text x="265" y="41">Temporal Server</text>

  <line class="arrow" x1="340" y1="32" x2="385" y2="32"/>
  <text x="362" y="24" class="ds">task</text>

  <rect class="box" x="390" y="10" width="130" height="44"/>
  <text x="455" y="41">Worker</text>

  <!-- Down from Worker -->
  <path d="M455,54 L455,95" class="arrow"/>

  <!-- Branch left -->
  <line class="arrow" x1="250" y1="95" x2="455" y2="95"/>

  <!-- Row 2 -->
  <rect class="box" x="160" y="95" width="180" height="50"/>
  <text x="250" y="117">Workflows</text>
  <text x="250" y="133" class="ds">orchestration logic</text>

  <rect class="box" x="340" y="95" width="170" height="50"/>
  <text x="425" y="117">Activities</text>
  <text x="425" y="133" class="ds">business logic</text>

  <line class="arrow" x1="340" y1="120" x2="340" y2="120"/>

  <!-- Down from Activities -->
  <path d="M425,145 L425,190" class="arrow"/>

  <!-- Row 3 -->
  <rect class="box" x="330" y="190" width="130" height="44"/>
  <text x="395" y="221">Database</text>

  <rect class="box" x="330" y="255" width="130" height="44"/>
  <text x="395" y="286">External APIs</text>

  <path d="M425,190 L395,190" class="arrow"/>
  <path d="M425,190 L425,255" class="arrow"/>
</svg>
