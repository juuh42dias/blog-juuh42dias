<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 310">
  <style>
    text { font-family: Verdana, sans-serif; font-size: 13px; fill: #1e1e1e; text-anchor: middle; alignment-baseline: middle; }
    .box { fill: #f0f0f0; stroke: #1e1e1e; stroke-width: 1.5; rx: 5; }
    .arrow { stroke: #1e1e1e; stroke-width: 1.5; fill: none; marker-end: url(#a); }
    .ds { font-size: 11px; fill: #555; }
  </style>
  <defs>
    <marker id="a" fill="#1e1e1e" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z"/></marker>
  </defs>

  <!-- Row 1 -->
  <rect class="box" x="35" y="20" width="130" height="44"/>
  <text x="100" y="42">Client</text>
  <line class="arrow" x1="165" y1="42" x2="230" y2="42"/>
  <text x="198" y="33" class="ds">start_workflow</text>

  <rect class="box" x="230" y="20" width="140" height="44"/>
  <text x="300" y="42">Temporal Server</text>
  <line class="arrow" x1="370" y1="42" x2="435" y2="42"/>
  <text x="403" y="33" class="ds">task</text>

  <rect class="box" x="435" y="20" width="130" height="44"/>
  <text x="500" y="42">Worker</text>

  <!-- Down from Worker to row 2 -->
  <path d="M500,64 L500,110" class="arrow"/>

  <!-- Branch line at y=110 from Workflows center to Worker center -->
  <path d="M270,110 L500,110" class="arrow"/>

  <!-- Row 2 -->
  <rect class="box" x="185" y="110" width="170" height="50"/>
  <text x="270" y="135">Workflows</text>
  <text x="270" y="152" class="ds">orchestration logic</text>

  <rect class="box" x="385" y="110" width="170" height="50"/>
  <text x="470" y="135">Activities</text>
  <text x="470" y="152" class="ds">business logic</text>

  <line class="arrow" x1="355" y1="135" x2="385" y2="135"/>

  <!-- Down from Activities to row 3 -->
  <path d="M470,160 L470,205" class="arrow"/>

  <!-- Branch left to Database -->
  <path d="M470,205 L410,205" class="arrow"/>

  <!-- Branch down to External APIs -->
  <path d="M470,205 L470,250" class="arrow"/>

  <!-- Row 3 -->
  <rect class="box" x="340" y="205" width="140" height="44"/>
  <text x="410" y="227">Database</text>

  <rect class="box" x="430" y="250" width="140" height="44"/>
  <text x="500" y="272">External APIs</text>
</svg>
