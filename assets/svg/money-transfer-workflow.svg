<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 520">
  <style>
    text { font-family: Verdana, sans-serif; font-size: 13px; fill: #1e1e1e; text-anchor: middle; alignment-baseline: middle; }
    .box { fill: #f0f0f0; stroke: #1e1e1e; stroke-width: 1.5; rx: 5; }
    .pill { fill: #f0f0f0; stroke: #1e1e1e; stroke-width: 1.5; rx: 22; }
    .arrow { stroke: #1e1e1e; stroke-width: 1.5; fill: none; marker-end: url(#a); }
    .ds { font-size: 11px; fill: #555; }
    .lb { font-size: 11px; fill: #1e1e1e; }
  </style>
  <defs>
    <marker id="a" fill="#1e1e1e" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z"/></marker>
  </defs>

  <!-- Start -->
  <rect class="pill" x="225" y="10" width="150" height="44"/>
  <text x="300" y="32">Start Transfer</text>
  <line class="arrow" x1="300" y1="54" x2="300" y2="75"/>

  <!-- Withdraw -->
  <rect class="box" x="215" y="75" width="170" height="54"/>
  <text x="300" y="97">Withdraw</text>
  <text x="300" y="115" class="ds">from source account</text>
  <line class="arrow" x1="300" y1="129" x2="300" y2="165"/>

  <!-- Success? (diamond) -->
  <polygon points="300,165 360,200 300,235 240,200" class="box"/>
  <text x="300" y="200" font-weight="bold">Success?</text>

  <!-- Yes → Deposit -->
  <text x="370" y="193" class="lb">Yes</text>
  <path d="M360,200 L390,200 L390,302 L385,302" class="arrow"/>

  <!-- No → Retry -->
  <text x="230" y="193" class="lb">No</text>
  <path d="M240,200 L190,200 L190,162" class="arrow"/>

  <!-- Retry -->
  <rect class="box" x="90" y="140" width="100" height="44"/>
  <text x="140" y="162">Retry Policy</text>

  <!-- Retry → loop back to diamond -->
  <path d="M140,184 L140,195 L300,195 L300,165" class="arrow" style="stroke-dasharray: 4,3;"/>

  <!-- Deposit -->
  <rect class="box" x="215" y="275" width="170" height="54"/>
  <text x="300" y="297">Deposit</text>
  <text x="300" y="315" class="ds">into target account</text>
  <line class="arrow" x1="300" y1="329" x2="300" y2="365"/>

  <!-- Success? (diamond) -->
  <polygon points="300,365 360,400 300,435 240,400" class="box"/>
  <text x="300" y="400" font-weight="bold">Success?</text>

  <!-- Yes → Complete -->
  <text x="370" y="393" class="lb">Yes</text>
  <path d="M360,400 L390,400 L390,492 L375,492" class="arrow"/>

  <!-- No → Refund -->
  <text x="230" y="393" class="lb">No</text>
  <path d="M240,400 L215,400 L215,457" class="arrow"/>

  <!-- Refund -->
  <rect class="box" x="65" y="430" width="150" height="54"/>
  <text x="140" y="457">Refund</text>
  <text x="140" y="475" class="ds">to source account</text>

  <!-- Refund → Complete -->
  <path d="M215,457 L225,457 L225,492" class="arrow"/>

  <!-- Complete -->
  <rect class="pill" x="225" y="470" width="150" height="44"/>
  <text x="300" y="492">Transfer Complete</text>
</svg>
